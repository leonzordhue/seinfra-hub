name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Verifica a sintaxe do JS inline do index.html ANTES do deploy.
  # Um erro de sintaxe em qualquer linha derruba a plataforma inteira —
  # este job impede que uma versão quebrada chegue ao ar.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verificar sintaxe do JS inline
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("index.html", "utf8");
            const blocks = [...src.matchAll(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g)];
            if (!blocks.length) { console.error("Nenhum <script> inline encontrado — estrutura mudou?"); process.exit(1); }
            blocks.forEach((m, i) => fs.writeFileSync(`blk${i}.js`, m[1]));
            console.log(blocks.length + " bloco(s) de script extraído(s)");
          '
          for f in blk*.js; do
            node --check "$f"
            echo "$f: sintaxe OK"
          done

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
