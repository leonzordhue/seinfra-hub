name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # commit feito pelo GITHUB_TOKEN (bots de dados) não dispara "push": publica quando eles terminam
  workflow_run:
    workflows: ["Sinistros (diário)", "Licitações (diário)", "Mapa (semanal)", "Sinistros oficiais (mensal)", "Acessibilidade rodoviária (mensal)", "Ambiente e rios (diário)", "Terminais (diário)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Verifica a sintaxe do JS inline do index.html ANTES do deploy.
  # Um erro de sintaxe em qualquer linha derruba a plataforma inteira —
  # este job impede que uma versão quebrada chegue ao ar.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verificar sintaxe do JS inline
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("index.html", "utf8");
            const blocks = [...src.matchAll(/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g)];
            if (!blocks.length) { console.error("Nenhum <script> inline encontrado — estrutura mudou?"); process.exit(1); }
            blocks.forEach((m, i) => fs.writeFileSync(`blk${i}.js`, m[1]));
            console.log(blocks.length + " bloco(s) de script extraído(s)");
          '
          for f in blk*.js; do
            node --check "$f"
            echo "$f: sintaxe OK"
          done
      - name: Verificar sintaxe dos módulos da v2
        run: |
          set -e
          for f in $(find v2 -name '*.js' 2>/dev/null); do node --check "$f"; done
          echo "módulos da v2: sintaxe OK"
      # nome indefinido, chave duplicada etc. (eslint.config.mjs); pegaria o "R is not defined" de 25/11/2026
      - name: Lint dos módulos da v2
        run: |
          npm i --no-save --no-audit --no-fund eslint@9 globals
          npx eslint v2/js

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main   # no workflow_run, pega o commit novo dos dados
          fetch-depth: 300   # histórico para o "o que mudou" do Painel do dia (scripts/painel.py)
      # estado das fontes + mudanças dos últimos 7 dias; vai só no artefato publicado (sem commit)
      - name: Gerar data/painel.json
        run: python3 -I scripts/painel.py --teste && python3 -I scripts/painel.py || echo "painel.json não gerado; o Painel do dia segue sem a seção"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # a API de artefatos às vezes falha ("No artifacts named github-pages") quando dois deploys correm juntos: tenta de novo
      - name: Aguardar antes da 2ª tentativa
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Deploy to GitHub Pages (2ª tentativa)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
