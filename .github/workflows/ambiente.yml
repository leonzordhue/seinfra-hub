# Ambiente e rios: cotas dos rios (ANA) e focos de queimada perto das rodovias (INPE). [Claude] 23/11/2026
# -> data/hidro.json e data/queimadas.json, todo dia. Os caches (telemetria diária e focos de períodos fechados)
# ficam em pipelines/*/cache/ para não baixar de novo; a 1ª rodada demora (backfill da telemetria de Manaus desde 2015).
name: Ambiente e rios (diário)

on:
  schedule:
    - cron: "0 9 * * *"   # 05h00 Manaus
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely==2.0.6 numpy
      - run: python -I pipelines/hidro/coletar.py --teste
      - run: python -I pipelines/queimadas/coletar.py --teste
      - name: Rios (ANA)
        run: python -I pipelines/hidro/coletar.py
        continue-on-error: true
      - name: Queimadas (INPE)
        run: python -I pipelines/queimadas/coletar.py
        continue-on-error: true
      - name: Publicar
        run: |
          git config user.name "dmob-bot"
          git config user.email "dmob-bot@users.noreply.github.com"
          for p in data/hidro.json data/queimadas.json pipelines/hidro/cache pipelines/queimadas/cache; do [ ! -e "$p" ] || git add "$p"; done
          git diff --cached --quiet && { echo "sem novidade"; exit 0; }
          git commit -m "dados: rios e queimadas $(date -u +%d/%m/%Y)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
