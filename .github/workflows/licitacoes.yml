# Licitações da SEINFRA (PNCP + CSC-AM) -> data/licitacoes.json, todo dia útil. [Nexus] 23/11/2026
name: Licitações (diário)

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 07h30 Manaus, seg a sex
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I pipelines/licitacoes/coletar.py --teste
      - run: python -I pipelines/licitacoes/coletar.py
      # Preços x SICRO [Claude] 23/11/2026: lê a planilha orçamentária (PDF com texto) dos editais de obra.
      # data/sicro_am*.json vêm do PC (sicro_extrato.py, bases-de-custo); aqui só são lidos.
      - run: pip install pypdf==6.19.0
      - run: python -I pipelines/licitacoes/precos.py --teste
      - name: Preços x SICRO
        continue-on-error: true   # PNCP instável não pode segurar a publicação das licitações
        run: python -I pipelines/licitacoes/precos.py
      - name: Publicar
        run: |
          git config user.name "dmob-bot"
          git config user.email "dmob-bot@users.noreply.github.com"
          git add data/licitacoes.json data/precos.json
          git diff --cached --quiet && { echo "sem novidade"; exit 0; }
          git commit -m "dados: licitações $(date -u +%d/%m/%Y)"
          git pull --rebase && git push
